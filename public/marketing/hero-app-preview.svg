<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 844" fill="none">
  <defs>
    <linearGradient id="heroGrad" x1="0" y1="0" x2="390" y2="200" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ECFDF5"/>
      <stop offset="1" stop-color="#FFFFFF"/>
    </linearGradient>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="6" flood-color="#059669" flood-opacity="0.06"/>
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#000" flood-opacity="0.04"/>
    </filter>
    <filter id="btnShadow" x="-10%" y="-20%" width="120%" height="160%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#059669" flood-opacity="0.28"/>
    </filter>
  </defs>

  <!-- Screen background -->
  <rect width="390" height="844" fill="#FFFFFF"/>

  <!-- Status bar -->
  <text x="32" y="52" fill="#1F2937" font-family="system-ui,-apple-system,sans-serif" font-size="15" font-weight="600">9:41</text>
  <rect x="318" y="38" width="22" height="11" rx="3" fill="none" stroke="#1F2937" stroke-width="1.2"/>
  <rect x="320" y="40" width="16" height="7" rx="1.5" fill="#1F2937"/>
  <rect x="354" y="40" width="3" height="7" rx="1" fill="#1F2937"/>

  <!-- Welcome header -->
  <text x="24" y="108" fill="#1F2937" font-family="system-ui,-apple-system,sans-serif" font-size="22" font-weight="700">Good afternoon, Alex</text>
  <text x="24" y="130" fill="#9CA3AF" font-family="system-ui,-apple-system,sans-serif" font-size="13" font-weight="500">Sat, Aug 1</text>
  <circle cx="354" cy="108" r="20" fill="#F1F5F9" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="354" y="113" text-anchor="middle" fill="#059669" font-family="system-ui,-apple-system,sans-serif" font-size="15" font-weight="700">A</text>

  <!-- Today overview card -->
  <rect x="20" y="158" width="350" height="118" rx="16" fill="#F8FAF9" stroke="#059669" stroke-opacity="0.1" stroke-width="1" filter="url(#cardShadow)"/>
  <text x="36" y="188" fill="#9CA3AF" font-family="system-ui,-apple-system,sans-serif" font-size="11" font-weight="600">SCREEN TIME</text>
  <text x="36" y="214" fill="#1F2937" font-family="system-ui,-apple-system,sans-serif" font-size="22" font-weight="800">2h 14m</text>
  <line x1="195" y1="180" x2="195" y2="212" stroke="#6B7280" stroke-opacity="0.12" stroke-width="1"/>
  <text x="354" y="188" text-anchor="end" fill="#9CA3AF" font-family="system-ui,-apple-system,sans-serif" font-size="11" font-weight="600">FOCUS TODAY</text>
  <text x="354" y="214" text-anchor="end" fill="#1F2937" font-family="system-ui,-apple-system,sans-serif" font-size="22" font-weight="800">45m</text>
  <!-- Progress bar -->
  <rect x="36" y="232" width="318" height="5" rx="2.5" fill="#059669" fill-opacity="0.08"/>
  <rect x="36" y="232" width="186" height="5" rx="2.5" fill="#059669"/>
  <text x="36" y="256" fill="#6B7280" font-family="system-ui,-apple-system,sans-serif" font-size="11">58m left of 3h</text>
  <!-- Streak chip -->
  <rect x="290" y="242" width="52" height="22" rx="8" fill="#F59E0B" fill-opacity="0.12"/>
  <path d="M302 248c2 3 4 5 4 8a4 4 0 11-8 0c0-2 2-4 4-8z" fill="#F59E0B"/>
  <text x="314" y="256" fill="#F59E0B" font-family="system-ui,-apple-system,sans-serif" font-size="11" font-weight="700">5 d</text>

  <!-- Shortcut: Block apps -->
  <rect x="20" y="340" width="350" height="64" rx="14" fill="#F8FAF9" stroke="#059669" stroke-opacity="0.08" stroke-width="1"/>
  <rect x="34" y="352" width="40" height="40" rx="10" fill="#059669" fill-opacity="0.1"/>
  <rect x="46" y="364" width="16" height="16" rx="2" fill="none" stroke="#059669" stroke-width="2"/>
  <line x1="50" y1="372" x2="58" y2="372" stroke="#059669" stroke-width="2"/>
  <text x="86" y="370" fill="#1F2937" font-family="system-ui,-apple-system,sans-serif" font-size="14" font-weight="700">Block apps</text>
  <text x="86" y="388" fill="#6B7280" font-family="system-ui,-apple-system,sans-serif" font-size="12">Choose what to limit</text>
  <path d="M348 372l4 4-4 4" stroke="#9CA3AF" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

  <!-- Shortcut: Usage details -->
  <rect x="20" y="412" width="350" height="64" rx="14" fill="#F8FAF9" stroke="#059669" stroke-opacity="0.08" stroke-width="1"/>
  <rect x="34" y="424" width="40" height="40" rx="10" fill="#059669" fill-opacity="0.1"/>
  <rect x="44" y="436" width="4" height="12" rx="1" fill="#059669"/>
  <rect x="50" y="432" width="4" height="16" rx="1" fill="#059669"/>
  <rect x="56" y="438" width="4" height="10" rx="1" fill="#059669"/>
  <text x="86" y="442" fill="#1F2937" font-family="system-ui,-apple-system,sans-serif" font-size="14" font-weight="700">Usage details</text>
  <text x="86" y="460" fill="#6B7280" font-family="system-ui,-apple-system,sans-serif" font-size="12">Charts and top apps</text>
  <path d="M348 444l4 4-4 4" stroke="#9CA3AF" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

  <!-- Start Focus Session button -->
  <rect x="20" y="688" width="350" height="56" rx="28" fill="#059669" filter="url(#btnShadow)"/>
  <circle cx="148" cy="720" r="12" fill="white" fill-opacity="0.2"/>
  <polygon points="144,714 144,726 154,720" fill="white"/>
  <text x="210" y="725" text-anchor="middle" fill="white" font-family="system-ui,-apple-system,sans-serif" font-size="16" font-weight="700">Start Focus Session</text>

  <!-- Floating bottom nav -->
  <rect x="16" y="768" width="358" height="64" rx="28" fill="white" fill-opacity="0.92" stroke="#059669" stroke-opacity="0.12" stroke-width="1" filter="url(#cardShadow)"/>
  <!-- Home active -->
  <rect x="28" y="776" width="72" height="48" rx="20" fill="#059669" fill-opacity="0.12"/>
  <rect x="50" y="788" width="16" height="16" rx="3" fill="none" stroke="#059669" stroke-width="1.8"/>
  <path d="M54 796h8M58 792v8" stroke="#059669" stroke-width="1.5" stroke-linecap="round"/>
  <text x="58" y="822" text-anchor="middle" fill="#059669" font-family="system-ui,-apple-system,sans-serif" font-size="10" font-weight="600">Home</text>
  <!-- Apps -->
  <rect x="118" y="790" width="14" height="14" rx="3" fill="none" stroke="#9CA3AF" stroke-width="1.5"/>
  <text x="125" y="822" text-anchor="middle" fill="#9CA3AF" font-family="system-ui,-apple-system,sans-serif" font-size="10" font-weight="500">Apps</text>
  <!-- Web -->
  <circle cx="195" cy="797" r="7" fill="none" stroke="#9CA3AF" stroke-width="1.5"/>
  <ellipse cx="195" cy="797" rx="7" ry="3" fill="none" stroke="#9CA3AF" stroke-width="1.2"/>
  <text x="195" y="822" text-anchor="middle" fill="#9CA3AF" font-family="system-ui,-apple-system,sans-serif" font-size="10" font-weight="500">Web</text>
  <!-- Insights -->
  <rect x="268" y="788" width="4" height="10" rx="1" fill="#9CA3AF"/>
  <rect x="274" y="784" width="4" height="14" rx="1" fill="#9CA3AF"/>
  <rect x="280" y="790" width="4" height="8" rx="1" fill="#9CA3AF"/>
  <text x="276" y="822" text-anchor="middle" fill="#9CA3AF" font-family="system-ui,-apple-system,sans-serif" font-size="10" font-weight="500">Insights</text>

  <!-- Home indicator -->
  <rect x="128" y="828" width="134" height="5" rx="2.5" fill="#1F2937" fill-opacity="0.15"/>
</svg>
